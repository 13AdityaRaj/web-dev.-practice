<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><title>Padhai Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;--bg:#0b1020;--card:#131a2e;--card2:#18213a;--ink:#eaf0ff;--mute:#8b97b8;--line:#243050;--acc:#7f95ff;--ok:#4cc38a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 400px at 50% -100px,#1b2650,var(--bg));background-color:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:600px;margin:0 auto;padding:14px 14px 40px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;font-weight:600}
.tabs button.on{background:var(--acc);color:#0b1020;border-color:var(--acc)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#1c2a5e,#131a2e 70%);border-color:#2f3f7a}
.lv{font-size:13px;color:var(--mute)}.lt{font-size:22px;font-weight:700;line-height:1.2}
.mute{color:var(--mute);font-size:14px}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--c,var(--ok));border-radius:5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mute)}
h2{font-size:15px;margin:0 0 10px}
.week{display:flex;gap:8px;align-items:flex-end;height:90px}
.week div{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.week i{display:block;background:var(--acc);border-radius:5px;margin-bottom:4px;min-height:4px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--line)}
.r{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.r:first-of-type{border-top:0}
.r .t{color:var(--mute);font-size:12px;text-align:right;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:14px;padding:14px;text-align:center;color:var(--ink);font:inherit;width:100%}
.sc b{display:block;margin-top:4px}.sc span{font-size:13px;color:var(--mute)}
details{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;margin-bottom:10px}
summary{padding:13px 14px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.sr{display:flex;justify-content:space-between;gap:10px}
.sr b{font-weight:600}.sr em{font-style:normal;color:var(--mute);white-space:nowrap}
summary.full .sr em{color:var(--ok)}
.items{padding:0 14px 8px}
label{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
label input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--c)}
label.d span{color:var(--mute);text-decoration:line-through}
label small{margin-left:auto;color:var(--mute);font-size:11px;text-align:right}
textarea{width:100%;height:80px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;font:12px monospace}
.add{display:flex;gap:8px;padding:10px 0}.add input{flex:1;min-width:0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}.add .btn{margin:0}.x{margin-left:6px;background:none;border:0;color:var(--mute);font-size:20px;padding:0 6px}
.it{border-top:1px solid var(--line)}.it label{border-top:0;flex:1}.rw{display:flex;align-items:center}
.ic{display:flex;gap:2px;flex:none}.ic button{background:none;border:0;color:var(--mute);font:inherit;font-size:14px;padding:6px 7px;border-radius:8px}
.nta{margin:0 0 10px;height:70px;font:14px system-ui}.qs{padding:0 0 6px 8px}.qs label{padding:7px 0;font-size:14px}.qs input{width:18px;height:18px}
.warn{border-left:3px solid #ff5d5d;padding-left:8px}.rd{color:#ff6b6b!important;font-weight:600}
.redbox{background:#2a1218;border-color:#ff5d5d}.redbox h2{color:#ff8a8a}
.nb{padding:8px 0;border-top:1px solid var(--line)}.nb:first-of-type{border:0}.sel{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
.tabs button{font-size:14px;padding:11px 4px}
.chips{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}.chips button{flex:none;padding:9px 18px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600}.chips button.on{background:var(--acc);color:#0b1020;border-color:var(--acc)}
details.sb{border:0;border-top:1px solid var(--line);border-radius:0;margin:0;background:none}details.sb summary{padding:11px 0}.items>details.sb:first-child{border-top:0}.items label small{white-space:nowrap}
.tabs button{font-size:12.5px;padding:11px 2px}
.btn{padding:10px 14px;border:0;border-radius:10px;background:var(--acc);color:#0b1020;font:inherit;font-weight:600;margin:6px 6px 0 0}
</style></head><body><main><div id="nav"></div><div id="v"></div></main>

  else if(!seen[k]){seen[k]=1;const rem=D[k].p.filter((_,q)=>pd(k,q)<D[k].p[q][1].length).length;left+=`<div class="r"><span>${D[k].n}: Part ${p+1}, ${x[0]}</span><span class="t">${t-d} topics<br>${rem} parts baki</span></div>`}}));
 h+=`<div class="box"><h2>Ab kya karna hai</h2>${left||'<div class="mute">Sab complete.</div>'}</div>`;
 h+=`<div class="box"><h2>Parts jo complete hue</h2>${parts||'<div class="mute">Abhi koi nahi. Pehla part complete kar.</div>'}</div>`;
 const rec=[];subs.forEach(k=>D[k].p.forEach((x,p)=>x[1].forEach((n,i)=>{const v=S[id(k,p,i)];if(v)rec.push([v,D[k].n+": "+n])})));rec.sort().reverse();
 h+=`<div class="box"><h2>Recent activity</h2>${rec.slice(0,20).map(r=>`<div class="r"><span>${r[1]}</span><span class="t">${dtm(r[0])}</span></div>`).join("")||'<div class="mute">Pehla topic tick kar.</div>'}</div>`;
 h+=`<div class="box"><h2>Backup</h2><div class="mute">Data is browser me save hai. Browser data clear karne se pehle Export karke text kahin rakh le.</div><button class="btn" onclick="ex()">Export</button><button class="btn" onclick="im()">Import</button><textarea id="bk" aria-label="backup"></textarea></div>`;
 return h}
function ex(){const t=document.getElementById("bk");t.value=JSON.stringify(S);t.select();try{document.execCommand("copy")}catch(e){}}
function im(){try{S=JSON.parse(document.getElementById("bk").value);save();render()}catch(e){document.getElementById("bk").value="Galat data. Export wala text paste kar."}}
render();
</script></body></html>
